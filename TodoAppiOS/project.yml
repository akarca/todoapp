name: TodoAppiOS
options:
  bundleIdPrefix: org.yuix
  deploymentTarget:
    iOS: "17.0"
targets:
  TodoAppiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: TodoAppiOS/TodoAppiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.yuix.TodoApp
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yuix.TodoApp.ios
        PRODUCT_NAME: TodoApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Todo maddelerine fotoğraf eklemek için kameraya erişim gerekiyor."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
