name: TodoAppiOS
options:
  bundleIdPrefix: com.serdar
  deploymentTarget:
    iOS: "17.0"
targets:
  TodoAppiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: TodoAppiOS/TodoAppiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.serdar.TodoApp
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serdar.TodoApp
        PRODUCT_NAME: TodoApp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
