name: TodoAppMac
options:
  bundleIdPrefix: com.serdar
  deploymentTarget:
    macOS: "14.0"
packages:
  TodoKit:
    path: ../
targets:
  TodoAppMac:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/TodoApp
      - path: Assets.xcassets
    dependencies:
      - package: TodoKit
        product: TodoKit
    entitlements:
      path: TodoAppMac/TodoAppMac.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.yuix.TodoApp
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yuix.TodoApp.mac
        PRODUCT_NAME: Todo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
